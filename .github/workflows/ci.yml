name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate synthetic dataset (small sample for CI)
        run: python data/generate_dataset.py --n-users 300 --n-transactions 8000 --fraud-rate 0.02

      - name: Train models
        run: python src/train.py --transactions data/transactions.csv --features-out data/feature_table.parquet --model-dir models

      - name: Run tests
        run: pytest tests/ -v
